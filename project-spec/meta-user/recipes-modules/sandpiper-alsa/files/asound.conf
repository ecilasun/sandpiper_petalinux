# ALSA configuration for Sandpiper APU
# This makes the Sandpiper APU the default audio device

pcm.!default {
    type hw
    card 0
    device 0
}

ctl.!default {
    type hw
    card 0
}

# Define a software volume control (if needed)
pcm.softvol {
    type softvol
    slave {
        pcm "hw:0,0"
    }
    control {
        name "PCM"
        card 0
    }
}
